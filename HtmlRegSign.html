<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="stylecssRegSign.css">
        <meta charset="UTF-8">
        <title>RegistrationSignIn</title>
    </head>
    <body> 
<div class="circle">
        <div id="RegWindow">
            <h1>Registration: </h1>
            <input id="InputNameReg" placeholder="Ivan123" >
            <input id="InputPasswordReg" type="password" placeholder="12345">
            <button type="button" id="ButtonReg">Register</button>
            <button type="button" id="ButtonToSignIn">To Sign In</button>
            
        </div>
        <div id="SignInWindow">
            <h1>Sign In:</h1>
            <input id="InputNameSignIn" placeholder="Ivan123" >
            <input id="InputPasswordSignIn" placeholder="12345" type="password">
            <button type="button" id="ButtonSignIn">Sign In</button>
            <button type="button" id="ButtonToReg">To Reg</button>
    
        </div>
         <div id="SignInMaessage">
        <h2>You have successfully logged in.<style>#SignInMaessage h2{color:Gold;text-decoration:underline;}</style></h2>
        
        <button id="WindowSignInTrueButton" type="button">Ok</button>
    </div>

    <div id="SignInMaessageFalse">
        <h2>You have unsuccessfully logged in.<style>#SignInMaessageFalse h2{color:red;text-decoration:underline;}</style></h2>
        
        <button id="WindowSignInFalseButton" type="button">Ok</button>

    </div>
=
    </div>        
   
        <script src="jsRegSign.js"></script>
    </body>
</html>
